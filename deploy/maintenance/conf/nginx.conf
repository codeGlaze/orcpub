server {
    listen 80;
    listen 443 ssl;
    server_name  localhost;
	
    ssl_certificate      /etc/nginx/snakeoil.crt;
    ssl_certificate_key  /etc/nginx/snakeoil.key;
    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    index index.html;
    location / {
		root   /usr/share/nginx/html;
    }
	location ~ /pages/(.*)$ {
		return 302 /;
	} 
	location ~ /generator/(.*)$ {
		return 302 /;
	} 
    # redirect server error pages to the static page /50x.html
    #
    error_page   403 =200 /50x.html;
	error_page   404 =200 /50x.html;
	error_page   500 =200 /50x.html;
	error_page   502 =200 /50x.html;
	error_page   503 =200 /50x.html;
	error_page   504 =200 /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
