---
# ============================================================================
# How variables work in this file
# ============================================================================
#
# Each ${VAR:-default} reads from TWO places, in this order:
#   1. Shell environment variables  (export VAR=value)
#   2. The .env file in this directory
#
# Shell env vars ALWAYS win over .env values. This means:
#   - You can override any setting with: VAR=value docker compose up -d
#   - If your shell already has a variable set (e.g. from a Codespace or
#     .bashrc), it will override what's in .env — even if you didn't intend it.
#
# To check what compose actually resolves:
#   docker compose config | grep DATOMIC_URL
#
# Recommended setup:
#   1. Run ./run to generate .env with secure passwords
#   2. Run: docker compose up --build -d
#   3. If a variable isn't being picked up from .env, check for a conflicting
#      shell variable with: echo $DATOMIC_URL
#      Clear it with: unset DATOMIC_URL
#
# See docs/DOCKER.md for the full quick-start guide.
# See docs/ENVIRONMENT.md for all available variables.
# ============================================================================


# Docker keeps each container's output in a log file on the host. Without a limit it grows until
# the disk is full; this keeps the last LOG_MAX_FILES files of LOG_MAX_SIZE each per container.
x-logging: &logging
  driver: json-file
  options:
    max-size: "${LOG_MAX_SIZE:-10m}"
    max-file: "${LOG_MAX_FILES:-5}"

services:
  orcpub:
    # Build: docker compose up --build
    # Override image: ORCPUB_IMAGE=registry/name:tag docker compose up
    image: ${ORCPUB_IMAGE:-orcpub-app}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: app
    environment:
      PORT: ${PORT:-8890}
      EMAIL_SERVER_URL: ${EMAIL_SERVER_URL:-}
      EMAIL_ACCESS_KEY: ${EMAIL_ACCESS_KEY:-}
      EMAIL_SECRET_KEY: ${EMAIL_SECRET_KEY:-}
      EMAIL_SERVER_PORT: ${EMAIL_SERVER_PORT:-587}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-}
      EMAIL_ERRORS_TO: ${EMAIL_ERRORS_TO:-}
      EMAIL_SSL: ${EMAIL_SSL:-FALSE}
      EMAIL_TLS: ${EMAIL_TLS:-FALSE}
      # Datomic Pro with dev storage protocol (required for Java 21 support).
      # The hostname MUST be "datomic" (the compose service name), NOT "localhost".
      # Password is NOT in the URL — the app reads DATOMIC_PASSWORD separately
      # and appends it at startup. Old URLs with ?password= still work.
      DATOMIC_URL: ${DATOMIC_URL:-datomic:dev://datomic:4334/orcpub}
      DATOMIC_PASSWORD: ${DATOMIC_PASSWORD:-change-me}
      SIGNATURE: ${SIGNATURE:-change-me-to-something-unique}
      CSP_POLICY: ${CSP_POLICY:-strict}
      DEV_MODE: ${DEV_MODE:-}
      # Empty EMAIL_SERVER_URL makes registration refuse rather than silently
      # accept unverified accounts; this is how you opt into the weaker mode.
      ALLOW_UNVERIFIED_REGISTRATION: ${ALLOW_UNVERIFIED_REGISTRATION:-}
      EMAIL_REQUIRED: ${EMAIL_REQUIRED:-}
      LOAD_HOMEBREW_URL: ${LOAD_HOMEBREW_URL:-}
      # Portrait artists' credits and accounts, the key that encrypts preferred names, and the
      # site address artist emails link to. See .env.example.
      PORTRAIT_ARTISTS: ${PORTRAIT_ARTISTS:-}
      PROFILE_ENCRYPTION_KEYS: ${PROFILE_ENCRYPTION_KEYS:-}
      APP_URL: ${APP_URL:-}
      EMAIL_ADMIN_TO: ${EMAIL_ADMIN_TO:-}
      # Where drawn shared-link portraits are kept. Mount a shared volume here to draw each once
      # for every container (a volume at /var/lib/orcpub/portraits, with this set to that path);
      # without one, each container keeps its own under /tmp.
      PORTRAIT_STORE_DIR: ${PORTRAIT_STORE_DIR:-}
      # Java's start-up flags. When it runs out of memory it writes a heap dump and exits so it is
      # restarted clean; a JVM crash writes a crash log. Both go to /var/log/$APP_LOGS_NAME on the host, and the
      # next start emails the admin. JAVA_OPTS (memory settings, see docs/DOCKER.md) comes last,
      # so it can override any of these.
      JDK_JAVA_OPTIONS: "-XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/lib/orcpub/state/crash/heap.hprof -XX:ErrorFile=/var/lib/orcpub/state/crash/jvm-crash-%p.log ${JAVA_OPTS:-}"
      # Every other setting the server reads. Empty means "use the default", so these change
      # nothing until set in .env. Only names listed here reach the container.
      # Proxies in front of the app (docs/ENVIRONMENT.md, Security)
      APP_LOGS_NAME: ${APP_LOGS_NAME:-orcpub}
      TRUST_CLOUDFLARE: ${TRUST_CLOUDFLARE:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Admin alerts (docs/ENVIRONMENT.md, Admin alerts)
      ALERT_SPOOL_DIR: ${ALERT_SPOOL_DIR:-/var/lib/orcpub/state/alerts}
      ALERT_MAX_PER_HOUR: ${ALERT_MAX_PER_HOUR:-}
      # Capacity (docs/ENVIRONMENT.md, Capacity)
      ORCPUB_HTTP_MAX_THREADS: ${ORCPUB_HTTP_MAX_THREADS:-}
      ORCPUB_PDF_CONCURRENCY: ${ORCPUB_PDF_CONCURRENCY:-}
      ORCPUB_PDF_QUEUE_TIMEOUT_MS: ${ORCPUB_PDF_QUEUE_TIMEOUT_MS:-}
      ORCPUB_PDF_MAX_RETRIES: ${ORCPUB_PDF_MAX_RETRIES:-}
      ORCPUB_PDF_MAX_CASTER_SECTIONS: ${ORCPUB_PDF_MAX_CASTER_SECTIONS:-}
      ORCPUB_PDF_MAX_CARDS: ${ORCPUB_PDF_MAX_CARDS:-}
      ORCPUB_PORTRAIT_CONCURRENCY: ${ORCPUB_PORTRAIT_CONCURRENCY:-}
      ORCPUB_PORTRAIT_QUEUE_TIMEOUT_MS: ${ORCPUB_PORTRAIT_QUEUE_TIMEOUT_MS:-}
      # Share links and passwords
      ORCPUB_SHARE_MAX_UPLOAD_KB: ${ORCPUB_SHARE_MAX_UPLOAD_KB:-}
      ORCPUB_SHARE_MAX_TEXT_KB: ${ORCPUB_SHARE_MAX_TEXT_KB:-}
      ORCPUB_SHARE_MAX_ACCOUNT_KB: ${ORCPUB_SHARE_MAX_ACCOUNT_KB:-}
      ORCPUB_SHARE_PRUNE_DAYS: ${ORCPUB_SHARE_PRUNE_DAYS:-}
      ORCPUB_PWNED_CHECK: ${ORCPUB_PWNED_CHECK:-}
      # Branding (docs/BRANDING-AND-INTEGRATIONS.md). Set, these override the branding file's defaults
      APP_NAME: ${APP_NAME:-}
      APP_TAGLINE: ${APP_TAGLINE:-}
      APP_PAGE_TITLE: ${APP_PAGE_TITLE:-}
      APP_LOGO_PATH: ${APP_LOGO_PATH:-}
      APP_OG_IMAGE: ${APP_OG_IMAGE:-}
      APP_HELP_URL: ${APP_HELP_URL:-}
      APP_SUPPORT_EMAIL: ${APP_SUPPORT_EMAIL:-}
      APP_EMAIL_SENDER_NAME: ${APP_EMAIL_SENDER_NAME:-}
      APP_EMAIL_SIGNOFF: ${APP_EMAIL_SIGNOFF:-}
      APP_COPYRIGHT_HOLDER: ${APP_COPYRIGHT_HOLDER:-}
      APP_COPYRIGHT_URL: ${APP_COPYRIGHT_URL:-}
      APP_COPYRIGHT_YEAR: ${APP_COPYRIGHT_YEAR:-}
      APP_FIELD_LIMIT_NOTES: ${APP_FIELD_LIMIT_NOTES:-}
      APP_FIELD_LIMIT_TEXT: ${APP_FIELD_LIMIT_TEXT:-}
      APP_FIELD_LIMIT_NUMBER: ${APP_FIELD_LIMIT_NUMBER:-}
      APP_SOCIAL_PATREON: ${APP_SOCIAL_PATREON:-}
      APP_SOCIAL_FACEBOOK: ${APP_SOCIAL_FACEBOOK:-}
      APP_SOCIAL_BLUESKY: ${APP_SOCIAL_BLUESKY:-}
      APP_SOCIAL_TWITTER: ${APP_SOCIAL_TWITTER:-}
      APP_SOCIAL_REDDIT: ${APP_SOCIAL_REDDIT:-}
      APP_SOCIAL_DISCORD: ${APP_SOCIAL_DISCORD:-}
    depends_on:
      datomic:
        condition: service_healthy
    healthcheck:
      # BusyBox wget (Alpine): only -q and --spider are supported.
      # Use 127.0.0.1 (not localhost) to avoid IPv4/IPv6 ambiguity.
      # /health returns 200 OK — lighter than / which renders the full SPA page.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${PORT:-8890}/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: always
    logging: *logging
    # The host's /var/log: the app keeps crash files and unsent admin alerts in
    # /var/log/$APP_LOGS_NAME (default orcpub), kept when the container is replaced.
    volumes:
      - /var/log:/host-log
  datomic:
    image: ${DATOMIC_IMAGE:-orcpub-datomic}
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: transactor
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-admin}
      DATOMIC_PASSWORD: ${DATOMIC_PASSWORD:-change-me}
      # ALT_HOST: what the transactor advertises to peers for fallback connections.
      # Default 127.0.0.1 works for single-host. Set to "datomic" for Swarm.
      ALT_HOST: ${ALT_HOST:-127.0.0.1}
      ENCRYPT_CHANNEL: ${ENCRYPT_CHANNEL:-true}
    volumes:
      - ./data:/data
      - ./logs:/log
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "grep -q ':10EE ' /proc/net/tcp || grep -q ':10EE ' /proc/net/tcp6"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 40s
    restart: always
    logging: *logging
  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      # nginx:alpine runs envsubst on /etc/nginx/templates/*.template at startup.
      # Only defined env vars are substituted — nginx's own $host, $scheme, etc. are safe.
      ORCPUB_PORT: ${PORT:-8890}
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template
      - ./deploy/snakeoil.crt:/etc/nginx/snakeoil.crt
      - ./deploy/snakeoil.key:/etc/nginx/snakeoil.key
      - ./deploy/homebrew/:/usr/share/nginx/html/homebrew/
    depends_on:
      orcpub:
        condition: service_healthy
    restart: always
    logging: *logging


# --- Docker Secrets ---
# Uncomment to use Docker secrets instead of .env for passwords.
# Secrets are mounted as files at /run/secrets/<name> inside the container.
# Both deploy/start.sh (transactor) and the app (config.clj) check
# /run/secrets/ first, then fall back to environment variables.
#
# Option A: File-based secrets (works with plain docker compose, no Swarm)
#   Each password goes in its own file instead of .env. Docker mounts
#   them inside the container. Still plain files on your hard drive —
#   but isolated with strict permissions instead of all in one .env.
#   Create a secrets/ directory with one file per secret:
#     mkdir -p secrets
#     printf 'mypassword' > secrets/datomic_password
#     printf 'mypassword' > secrets/admin_password
#     printf 'mysecret'   > secrets/signature
#     chmod 600 secrets/*
#
#   secrets:
#     datomic_password:
#       file: ./secrets/datomic_password
#     admin_password:
#       file: ./secrets/admin_password
#     signature:
#       file: ./secrets/signature
#
# Option B: External secrets (Swarm only — created via docker secret create)
#   Swarm stores passwords encrypted inside the cluster. When a container
#   needs one, Swarm delivers it into memory — the password is never
#   saved to the server's hard drive. Use this for multi-server clusters.
#   printf 'mypassword' | docker secret create datomic_password -
#   printf 'mypassword' | docker secret create admin_password -
#   printf 'mysecret'   | docker secret create signature -
#
#   secrets:
#     datomic_password:
#       external: true
#     admin_password:
#       external: true
#     signature:
#       external: true
#
# Then add to each service that needs secrets:
#   orcpub:
#     secrets:
#       - datomic_password
#       - signature
#   datomic:
#     secrets:
#       - datomic_password
#       - admin_password
#
# You can remove the corresponding env vars from .env, or leave them —
# secret files take priority over env vars.
