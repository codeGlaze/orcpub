---
version: '3'
services:
  orcpub:
    build:
      context: .
      dockerfile: docker/orcpub/Dockerfile
    environment:
      PORT: 8890
      EMAIL_SERVER_URL: 'smtp.lissproductions.com'
      EMAIL_ACCESS_KEY: 'thdm'
      EMAIL_SECRET_KEY: 'uqAf731yIAJlEKetkSV8'
      EMAIL_SERVER_PORT: 25
      # Email address to send errors to
      EMAIL_ERRORS_TO: 'thdm@dungeonmastersvault.com'
      DATOMIC_URL: datomic:dev://datomic:4334/orcpub
    depends_on:
      - datomic
    restart: always
  datomic:
    image: akiel/datomic-free
    #build:
    #  context: .
    #  dockerfile: docker/datomic/Dockerfile
    ports:
      - "4334:4334"
      - "4335:4335"
      - "4336:4336"
    volumes:
      - ./data:/data
      - ./logs:/logs
    restart: always
  web:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./deploy/snakeoil.crt:/etc/nginx/snakeoil.crt
      - ./deploy/snakeoil.key:/etc/nginx/snakeoil.key
      - ./deploy/homebrew/:/usr/share/nginx/html/homebrew/
    depends_on:
      - orcpub
    restart: always
