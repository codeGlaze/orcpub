# test/docker/test-backup-postgres.sh: Postgres 16, a SQL-storage transactor on the database named by
# PG_DB, and a stand-in "orcpub" service, so ./run --backup and --restore meet a Postgres stack.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: datomic
      POSTGRES_PASSWORD: datomic
      POSTGRES_DB: datomic
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datomic -d datomic"]
      interval: 2s
      retries: 30
  datomic:
    image: ${DATOMIC_IMAGE:-orcpub-datomic}
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DB: ${PG_DB:-datomic}
    entrypoint: ["sh", "-c"]
    command:
      - |
        cat > /tmp/sql.properties <<PROPS
        protocol=sql
        host=datomic
        alt-host=datomic
        port=4334
        sql-url=jdbc:postgresql://db:5432/$$PG_DB
        sql-user=datomic
        sql-password=datomic
        sql-driver-class=org.postgresql.Driver
        memory-index-threshold=32m
        memory-index-max=256m
        object-cache-max=128m
        PROPS
        exec bin/transactor /tmp/sql.properties
  orcpub:
    image: ${DATOMIC_IMAGE:-orcpub-datomic}
    entrypoint: ["sleep", "infinity"]
