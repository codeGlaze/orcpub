# Guard: a branch changelog must be FOLDED into CHANGELOG.md (and removed) before
# landing on integration or develop. See docs/CONTRIBUTING.md.
#
# Runs on pull requests into integration/develop/main as well as on push. A merge made
# through GitHub never runs the fold or the local pre-push hook, so the PR is the last
# place the fold can still happen: fold on the branch (scripts/fold-branch-changelog.sh),
# push, then merge. The push run stays as the backstop for merges made some other way.
# PR #40 merged with its branch changelog because this ran only after the merge.

name: Changelog guard

# Both jobs run on pull requests, where the author can still act, and on push. They
# share a workflow because they are one topic.
on:
  push:
    branches: [integration, develop, main]
  pull_request:
    branches: [integration, develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-changelog-folded:
    name: Branch changelog folded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A branch changelog must be folded before landing here
        run: |
          if [ -f docs/branch-changelog.md ]; then
            echo "::error file=docs/branch-changelog.md::An un-folded branch changelog is present. Fold it into CHANGELOG.md and remove it before this lands on ${GITHUB_BASE_REF:-$GITHUB_REF_NAME} — run: scripts/fold-branch-changelog.sh \"<release>\""
            exit 1
          fi
          echo "OK — no un-folded branch changelog on $GITHUB_REF_NAME."

  changelog-style:
    name: Changelog house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup step: ubuntu-latest ships python3, and the linter imports nothing
      # outside the standard library on purpose, so this stays a checkout and a run.
      - name: CHANGELOG.md follows docs/branch-changelog.template.md
        run: scripts/lint-changelog.py --stats
