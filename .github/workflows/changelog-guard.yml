# Guard: a branch changelog must be FOLDED into CHANGELOG.md (and removed) before
# landing on integration or develop. See docs/CONTRIBUTING.md.
#
# Runs on push (the post-merge backstop): if a merge landed on integration/develop
# without folding its docs/branch-changelog.md, this goes red — run
# scripts/fold-branch-changelog.sh, commit, and push again. Not run on
# pull_request, since the branch changelog legitimately lives on the feature branch
# until it is folded at merge time.

name: Changelog guard

# The fold guard is a post-merge backstop and only makes sense on push. The style
# lint is the opposite: it is feedback, so it also runs on pull_request, where the
# author can still act on it. Both are in one workflow because they are one topic.
on:
  push:
    branches: [integration, develop, main]
  pull_request:
    paths: ["CHANGELOG.md", "scripts/lint-changelog.py", ".github/workflows/changelog-guard.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-changelog-folded:
    name: Branch changelog folded
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A branch changelog must be folded before landing here
        run: |
          if [ -f docs/branch-changelog.md ]; then
            echo "::error file=docs/branch-changelog.md::An un-folded branch changelog is present on $GITHUB_REF_NAME. Fold it into CHANGELOG.md and remove it before landing — run: scripts/fold-branch-changelog.sh \"<release>\""
            exit 1
          fi
          echo "OK — no un-folded branch changelog on $GITHUB_REF_NAME."

  changelog-style:
    name: Changelog house style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No setup step: ubuntu-latest ships python3, and the linter imports nothing
      # outside the standard library on purpose, so this stays a checkout and a run.
      - name: CHANGELOG.md follows docs/branch-changelog.template.md
        run: scripts/lint-changelog.py --stats
