name: Continuous Integration

on:
  pull_request:
    branches:
      - develop
      - agents/develop
      - testing/develop
  push:
    branches:
      - 'feature/**'
      - 'testing/**'
      - 'docs/**'
      - 'ci/**'
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Load pdfbox from /lib
        run: |
          mkdir -p ~/.m2/repository/org/
          cp -rv ./lib/* ~/.m2/repository

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: '2.9.10'

      - name: Run linter
        run: lein lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Load pdfbox from /lib
        run: |
          mkdir -p ~/.m2/repository/org/
          cp -rv ./lib/* ~/.m2/repository

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Leiningen
        uses: DeLaGuardo/setup-clojure@12.5
        with:
          lein: '2.9.10'

      - name: Run CLJ tests
        run: lein test

      - name: Run CLJS tests
        run: lein doo node test once
