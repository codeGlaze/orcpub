# Dual-stack CI: auto-detects Java 8 (develop) vs Java 21 (breaking/) based
# on whether dev.cljs.edn exists in the checkout. After breaking/ merges to
# develop, the Java 8 path becomes dead code and can be removed.

name: CI

on:
  push:
    branches: [integration, develop, main]
  pull_request:
    branches: [integration, develop, main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  detect-stack:
    name: Detect Stack
    runs-on: ubuntu-latest
    outputs:
      java-version: ${{ steps.detect.outputs.java-version }}
      java-distribution: ${{ steps.detect.outputs.java-distribution }}
      lein-version: ${{ steps.detect.outputs.lein-version }}
      cljs-command: ${{ steps.detect.outputs.cljs-command }}
      needs-datomic-pro: ${{ steps.detect.outputs.needs-datomic-pro }}
      stack-label: ${{ steps.detect.outputs.stack-label }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect stack from project files
        id: detect
        run: |
          # dev.cljs.edn is the figwheel-main build config — only exists on
          # breaking/2026-stack-modernization (Java 21, Datomic Pro, fig:build).
          if [ -f "dev.cljs.edn" ]; then
            echo "Detected: figwheel-main stack (Java 21, Datomic Pro)"
            echo "java-version=21" >> $GITHUB_OUTPUT
            echo "java-distribution=temurin" >> $GITHUB_OUTPUT
            echo "lein-version=2.11.2" >> $GITHUB_OUTPUT
            echo "cljs-command=fig:build" >> $GITHUB_OUTPUT
            echo "needs-datomic-pro=true" >> $GITHUB_OUTPUT
            echo "stack-label=Java 21 / figwheel-main / Datomic Pro" >> $GITHUB_OUTPUT
          else
            echo "Detected: legacy stack (Java 8, Datomic Free)"
            echo "java-version=8" >> $GITHUB_OUTPUT
            echo "java-distribution=zulu" >> $GITHUB_OUTPUT
            echo "lein-version=2.9.10" >> $GITHUB_OUTPUT
            echo "cljs-command=cljsbuild once dev" >> $GITHUB_OUTPUT
            echo "needs-datomic-pro=false" >> $GITHUB_OUTPUT
            echo "stack-label=Java 8 / cljsbuild / Datomic Free" >> $GITHUB_OUTPUT
          fi

  test:
    name: Test & Lint (${{ needs.detect-stack.outputs.stack-label }})
    runs-on: ubuntu-latest
    needs: detect-stack

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Leiningen and dependencies
        uses: ./.github/actions/setup-lein
        with:
          java-version: ${{ needs.detect-stack.outputs.java-version }}
          java-distribution: ${{ needs.detect-stack.outputs.java-distribution }}
          lein-version: ${{ needs.detect-stack.outputs.lein-version }}
          needs-datomic-pro: ${{ needs.detect-stack.outputs.needs-datomic-pro }}

      - name: Run linter
        id: lint
        run: |
          echo "## Lint Results" >> $GITHUB_STEP_SUMMARY
          if lein lint 2>&1 | tee lint-output.txt; then
            echo "**Lint passed** - no errors" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Lint failed**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat lint-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Warnings may only go down: a new one fails here, by name (docs/kb/ci-signal-plan.md).
      - name: Lint warnings ratchet
        run: |
          set +e
          python3 scripts/lint-ratchet.py lint-output.txt test/lint-baseline.txt | tee ratchet.txt
          rc=${PIPESTATUS[0]}
          tail -1 ratchet.txt >> $GITHUB_STEP_SUMMARY
          exit $rc

      - name: Run tests
        id: test
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if lein test 2>&1 | tee test-output.txt; then
            SUMMARY=$(grep -E "^Ran [0-9]+ tests" test-output.txt || echo "Tests completed")
            echo "**Tests passed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "$SUMMARY" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Tests failed**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Build ClojureScript
        id: cljs
        run: |
          echo "## ClojureScript Build" >> $GITHUB_STEP_SUMMARY
          if lein ${{ needs.detect-stack.outputs.cljs-command }} 2>&1 | tee cljs-output.txt; then
            echo "**CLJS build succeeded**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**CLJS build failed**" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 cljs-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-logs
          path: |
            lint-output.txt
            test-output.txt
            cljs-output.txt
          retention-days: 7

  # Fails a PR, push or manual run whose shipped libraries carry a critical or high flaw, so a
  # vulnerable library is caught on its branch, not weeks later on develop's Dependabot alerts.
  # Accepted alerts, each with a reason and an expiry: osv-scanner.toml.
  security-scan:
    name: Library security scan
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Leiningen and dependencies
        uses: ./.github/actions/setup-lein
        with:
          java-version: ${{ needs.detect-stack.outputs.java-version }}
          java-distribution: ${{ needs.detect-stack.outputs.java-distribution }}
          lein-version: ${{ needs.detect-stack.outputs.lein-version }}
          needs-datomic-pro: ${{ needs.detect-stack.outputs.needs-datomic-pro }}

      - name: Scan the app's libraries (OSV)
        run: scripts/security-scan.sh

  # Real IP addresses, email addresses, keys, tokens and password hashes in the commits this run
  # brings, plus commit author emails (scripts/personal-data-scan.py, .personal-data-allow), then
  # gitleaks over the same commits for the key formats it knows.
  personal-data:
    name: Personal data scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Commits to scan
        id: range
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$BASE_REF" ]; then RANGE="origin/$BASE_REF..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then RANGE="$BEFORE..HEAD"
          elif [ -n "$BEFORE" ]; then RANGE="origin/$DEFAULT_BRANCH..HEAD"  # a push that created the branch
          else RANGE="HEAD~1..HEAD"; fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"; echo "Scanning $RANGE"

      - name: The scan's own table test
        run: python3 -I scripts/test/personal_data_scan_test.py

      - name: Our rules
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: python3 -I scripts/personal-data-scan.py --range "$RANGE"

      - name: gitleaks
        env:
          RANGE: ${{ steps.range.outputs.range }}
          GITLEAKS_VERSION: 8.24.3
          # From the release's gitleaks_8.24.3_checksums.txt; change both together.
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          tarball="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$RANGE" --redact --no-banner

  # Dependabot cannot read project.clj, so it never saw the server's libraries. lein pom writes them
  # as a Maven pom and the action uploads the resolved graph; GitHub then re-checks it against new
  # advisories by itself. Its own job, so contents: write never reaches a job that runs pull-request
  # code; push and manual runs only, since alerts read the default branch.
  dependency-graph:
    name: Submit Clojure dependencies
    runs-on: ubuntu-latest
    needs: detect-stack
    # Not integration: alerts read the default branch, and this job ran only for develop and main.
    if: github.event_name != 'pull_request' && github.ref_name != 'integration'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Leiningen and dependencies
        uses: ./.github/actions/setup-lein
        with:
          java-version: ${{ needs.detect-stack.outputs.java-version }}
          java-distribution: ${{ needs.detect-stack.outputs.java-distribution }}
          lein-version: ${{ needs.detect-stack.outputs.lein-version }}
          needs-datomic-pro: ${{ needs.detect-stack.outputs.needs-datomic-pro }}

      # The pom keeps project.clj's declared http Apache URL, which Maven 3.8+ refuses; lein itself
      # uses the https mirror.
      - name: Write pom.xml
        run: |
          lein pom
          sed -i 's#http://repository.apache.org#https://repository.apache.org#' pom.xml

      # Pinned to a commit: this third-party action holds write access.
      - name: Submit the dependency graph
        uses: advanced-security/maven-dependency-submission-action@fe8d4d650a4b66508612d0683ce4726d51dfe6ac # v4
        with:
          directory: .
