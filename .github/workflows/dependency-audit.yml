name: Dependency Audit

on:
  workflow_dispatch: {}
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  audit:
    name: Run dependency & test audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install system deps (Leiningen)
        run: |
          sudo apt-get update
          sudo apt-get install -y leiningen || true

      - name: Environment info
        run: |
          echo "=== Java Version ===" | tee audit-summary.txt
          java -version 2>&1 | tee -a audit-summary.txt
          echo "" | tee -a audit-summary.txt
          echo "=== Leiningen Version ===" | tee -a audit-summary.txt
          lein -v | tee -a audit-summary.txt
          echo "" | tee -a audit-summary.txt
          echo "=== Node Version ===" | tee -a audit-summary.txt
          node -v | tee -a audit-summary.txt
          echo "" | tee -a audit-summary.txt
          echo "=== NPM Version ===" | tee -a audit-summary.txt
          npm -v | tee -a audit-summary.txt

      - name: Capture dependency tree
        run: |
          lein deps :tree | tee deps-tree.txt

      - name: Run tests
        run: |
          lein test | tee test-results.txt

      - name: Run lint
        run: |
          lein lint | tee lint-results.txt

      - name: NPM outdated (informational)
        continue-on-error: true
        run: |
          npm outdated --json | tee npm-outdated.json || true

      - name: NPM-check-updates (informational)
        continue-on-error: true
        run: |
          npm i -g npm-check-updates --silent
          npx npm-check-updates --packageFile package.json --jsonUpgraded | tee ncu.json || true

      - name: Create summary
        run: |
          echo "Dependency audit finished. Artifacts: deps-tree.txt, test-results.txt, lint-results.txt, npm-outdated.json, ncu.json" > summary.txt
          cat summary.txt >> audit-summary.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-artifacts
          path: |
            audit-summary.txt
            deps-tree.txt
            test-results.txt
            lint-results.txt
            npm-outdated.json
            ncu.json

      - name: Post short summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request
            if (!pr) return
            const body = `Dependency audit ran. Artifacts attached to the workflow run. See the 'Artifacts' pane for detailed outputs (deps, tests, lint, npm outdated).`;
            await github.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: pr.number, body})

      - name: Write job summary
        run: |
          echo "## Dependency Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts: deps-tree.txt, test-results.txt, lint-results.txt, npm-outdated.json, ncu.json" >> $GITHUB_STEP_SUMMARY

    timeout-minutes: 30
