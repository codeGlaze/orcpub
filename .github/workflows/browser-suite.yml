# Runs the ClojureScript test suite in headless Chromium (lein fig:test, then
# test/e2e/cljs-harness.js; docs/kb/cljs-headless-harness.md).
#
# The JVM suite runs on integration through locale.yml, but the builder's wiring
# (re-frame events, interceptors, subscriptions) is tested only in the browser,
# so until this ran a change that broke it passed CI.

name: Browser suite

on:
  push:
    branches: [integration, develop, main]
  pull_request:
    branches: [integration, develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cljs-suite:
    name: ClojureScript suite in Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Pinned to the version continuous-integration.yml uses.
      - name: Install Leiningen
        uses: ./.github/actions/install-lein
        with:
          lein-version: '2.11.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package.json declares Playwright; its own Chromium, which find-chrome falls back to.
      - name: Install Playwright and Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Compile the test build
        run: lein fig:test

      # Exits 0 only when every test passes and no FAIL or ERROR is reported.
      - name: Run the suite headless
        run: node test/e2e/cljs-harness.js

  # Every page loads only what its allowance lists (no third-party hosts) and the production
  # bundle stays under its ceiling (test/browser/page_load_budget_e2e.js).
  page-load-budget:
    name: Page-load budget (production bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Leiningen
        uses: ./.github/actions/install-lein
        with:
          lein-version: '2.11.2'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright and Chromium
        working-directory: scripts/e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Builds the production bundle and stylesheet, boots the app on in-memory Datomic, and exits
      # non-zero unless its last line reads "E2E RESULT ... PASS".
      - name: Pages load only their allowance, under the bundle ceiling
        run: ./scripts/e2e/run.sh test/browser/page_load_budget_e2e.js

